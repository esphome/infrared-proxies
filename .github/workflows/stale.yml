name: Stale

on:
  schedule:
    - cron: '50 18 * * *'
  workflow_dispatch:

# The called workflow mints an ESPHome GitHub App token (from
# vars.ESPHOME_GITHUB_APP_CLIENT_ID and the ESPHOME_GITHUB_APP_PRIVATE_KEY
# secret) and never uses GITHUB_TOKEN, so no permissions are needed here.
permissions: {}

jobs:
  stale:
    name: Mark and close stale issues and PRs
    # Labels, comments and closures are attributed to esphome[bot]. Unlike
    # actions/stale, this workflow measures real activity (comments, commits
    # and reviews) instead of trusting updated_at, and it covers pull
    # requests as well as issues.
    uses: esphome/workflows/.github/workflows/stale.yml@cc3e76de337dc59bc1cba8da58d963cd23b873f1  # 2026.9.0
    secrets:
      ESPHOME_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
    with:
      # Live only on main: a workflow_dispatch from any other branch is a dry run
      dry-run: ${{ github.ref != 'refs/heads/main' }}
      days-before-stale: 30
      days-before-close: 5
      stale-label: stale
      exempt-label: not-stale
      stale-issue-message: >
        As there has been no activity on this issue for 30 days, I am marking
        it as stale. If you think this is a mistake, please comment below and
        I will remove the stale label.
      stale-pr-message: >
        As there has been no activity on this pull request for 30 days, I am
        marking it as stale. If you think this is a mistake, please comment
        below and I will remove the stale label.
