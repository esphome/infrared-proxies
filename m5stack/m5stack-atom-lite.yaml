esphome:
  name: m5stack-atom-lite
  friendly_name: Infrared Proxy
  min_version: 2025.8.0
  name_add_mac_suffix: true

esp32:
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ap:

api:
logger:

ota:
  - platform: esphome
    id: ota_esphome

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset

remote_transmitter:
  id: ir_tx
  pin: GPIO12
  carrier_duty_percent: 50%

infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
