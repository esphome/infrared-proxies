esphome:
  name: m5stack-atom-lite
  friendly_name: Infrared Proxy
  min_version: 2025.8.0
  name_add_mac_suffix: true

esp32:
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ap:

api:
logger:

ota:
  - platform: esphome
    id: ota_esphome

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset

remote_transmitter:
  id: ir_tx
  pin: GPIO12
  carrier_duty_percent: 50%

infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx

button:
  - platform: template
    name: Living Room Lights Scene 1
    id: living_room_lights_scene1
    on_press:
      - remote_transmitter.transmit_pronto:
          #data: "0000 0063 0000 0007 0356 011d 005f 011d 005f 0060 017b 0060 005f 011d 011d 0060 005f 01af"
          data: "0000 0069 0007 0000 032a 010e 005a 010e 005a 005a 0168 005a 005a 010e 010e 005a 005a 0168"
  - platform: template
    name: Living Room Lights Scene 2
    id: living_room_lights_scene2
    on_press:
      - remote_transmitter.transmit_pronto:
          #data: "0000 0063 0000 0007 0356 011d 005f 011e 005f 0060 017b 0060 005f 00bf 005f 00bf 005f 0281"
          data: "0000 0069 0007 0000 032a 010e 005a 010e 005a 005a 0168 005a 005a 00b4 005a 00b4 005a 021c"
  - platform: template
    name: Living Room Lights Scene 3
    id: living_room_lights_scene3
    on_press:
      - remote_transmitter.transmit_pronto:
          #data: "0000 0063 0000 0008 0356 011d 005f 011d 005f 0060 017c 0060 005f 00be 005f 0060 005f 0060 00be 01ae"
          data: "0000 0069 0008 0000 032a 010e 005a 010e 005a 005a 0168 005a 005a 00b4 005a 005a 005a 005a 00b4 0168"
  - platform: template
    name: Living Room Lights Scene 4
